name: Update lottery data

# Georgia Lottery refreshes the claimed-prize counts over the weekend, so pull on Mondays.
on:
  schedule:
    - cron: "23 13 * * 1" # Mondays 13:23 UTC (morning, US Eastern)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - run: node --test
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh lottery data"
          git push
